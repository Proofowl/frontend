name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# One job, one concern per step, actions pinned to major tags. The
# contract SDK is a normal registry dependency (@proofowl/contract-sdk),
# so a plain `npm ci` is all that's needed — no cross-repo checkout, no
# local SDK build.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install deps (locked)
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
